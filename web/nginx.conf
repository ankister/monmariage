# Nginx du conteneur « web » : sert le site statique et relaie /api vers le conteneur « api ».
# Nginx Proxy Manager (NPM) se place devant et gère le HTTPS.

# Si NPM indique le protocole d'origine (https), on le transmet ; sinon on prend celui de la connexion.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/calendar text/csv;

    # --- En-têtes de sécurité (déclarés uniquement ici pour s'appliquer partout) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Seules les tuiles OpenStreetMap sont chargées depuis l'extérieur
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Sonde de santé du conteneur
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # --- API ---
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        # $http_host conserve le port (utile pour tester en http://IP:port sur le réseau local)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # --- Fichiers statiques ---
    # Bibliothèques et polices : cache long
    location ^~ /vendor/ {
        expires 30d;
        access_log off;
    }

    # CSS / JS : cache court pour que les mises à jour arrivent vite chez les invités
    location ~* \.(css|js)$ {
        expires 1h;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
