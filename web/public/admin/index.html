<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf8f3">
  <title>Administration — Mariage</title>
  <link rel="icon" href="/api/favicon">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/plan.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/api/fonts.css">
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script src="/js/common.js" defer></script>
  <script src="/js/onsite-plan.js" defer></script>
  <script src="/admin/admin.js" defer></script>
  <script src="/admin/admin-rooms.js" defer></script>
  <script src="/admin/admin-appearance.js" defer></script>
  <script src="/admin/admin-budget.js" defer></script>
  <script src="/admin/admin-music.js" defer></script>
</head>
<body>
  <!-- Écran de connexion -->
  <section id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <div class="login-logo" aria-hidden="true">💍</div>
      <h1>Administration</h1>
      <p class="muted">Espace réservé aux mariés.</p>
      <label class="field">Mot de passe
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
      <p class="form-error" role="alert"></p>
      <a class="muted small" href="/">← Retour au site</a>
    </form>
  </section>

  <!-- Application -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">💍</span>
        <span><strong id="brand-couple">Mariage</strong><small>Administration</small></span>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-ghost btn-small" href="/" target="_blank" rel="noopener" aria-label="Voir le site"><span aria-hidden="true">🌐</span><span class="hide-sm">Voir le site</span></a>
        <button class="btn btn-ghost btn-small" id="logout" type="button" aria-label="Déconnexion"><span aria-hidden="true">⏻</span><span class="hide-sm">Déconnexion</span></button>
      </div>
    </header>

    <nav class="tabs" aria-label="Menu d'administration">
      <button type="button" data-view="dashboard"><span aria-hidden="true">📊</span><b>Accueil</b></button>
      <button type="button" data-view="guests"><span aria-hidden="true">👥</span><b>Invités</b></button>
      <button type="button" data-view="lodging"><span aria-hidden="true">🏡</span><b>Gîtes</b></button>
      <button type="button" data-view="rooms"><span aria-hidden="true">🛏️</span><b>Chambres</b></button>
      <button type="button" data-view="places"><span aria-hidden="true">📍</span><b>Lieux</b></button>
      <button type="button" data-view="content"><span aria-hidden="true">✏️</span><b>Contenu</b></button>
      <button type="button" data-view="music"><span aria-hidden="true">🎶</span><b>Musiques</b></button>
      <button type="button" data-view="budget"><span aria-hidden="true">💶</span><b>Budget</b></button>
      <button type="button" data-view="appearance"><span aria-hidden="true">🎨</span><b>Style</b></button>
      <button type="button" data-view="security"><span aria-hidden="true">🔒</span><b>Sécurité</b></button>
    </nav>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <!-- Fenêtre modale générique (formulaires, confirmations) -->
  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-inner" id="modal-form" novalidate>
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" value="cancel" type="submit" aria-label="Fermer">✕</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <p class="form-error" id="modal-error" role="alert"></p>
      <footer class="modal-foot" id="modal-foot"></footer>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
