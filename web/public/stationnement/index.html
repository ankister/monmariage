<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Où se garer ?</title>
  <link rel="icon" href="/api/favicon">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/onsite.css">
  <link rel="stylesheet" href="/css/parking.css">
  <link rel="stylesheet" href="/api/apparence">
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script src="/js/common.js" defer></script>
  <script src="/js/parking.js" defer></script>
</head>
<body class="onsite-page parking-page">
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="mini-header">
    <a class="back-link" href="/#programme">← <span data-bind="couple">Notre mariage</span></a>
    <a class="btn btn-small btn-ghost" href="/#rsvp">Répondre à l’invitation</a>
  </header>

  <main id="contenu">
    <section class="onsite-hero container">
      <p class="eyebrow">Mairie &amp; église</p>
      <h1>Où se garer ?</h1>
      <p class="lead-small pre" id="pk-intro"></p>
    </section>

    <section class="container">
      <div class="card pk-card">
        <div class="chips-row" role="group" aria-label="Filtrer les stationnements">
          <button type="button" class="filter-chip" data-filter="all" aria-pressed="true">Tous</button>
          <button type="button" class="filter-chip" data-filter="pmr" aria-pressed="false">♿ Places PMR</button>
          <button type="button" class="filter-chip" data-filter="free" aria-pressed="false">Gratuits</button>
        </div>
        <div class="map pk-map" id="pk-map" role="region" aria-label="Carte des stationnements"></div>
        <ul class="legend pk-legend" aria-label="Légende de la carte">
          <li><span class="pin-mini pin-mini-place">🏛️</span>Mairie / église</li>
          <li><span class="pin-mini pin-mini-park">P</span>Parking</li>
          <li><span class="pin-mini pin-mini-pmr">♿</span>Place PMR</li>
        </ul>
      </div>

      <h2 class="list-title" id="pk-title">Les stationnements</h2>
      <div class="pk-grid" id="pk-list"></div>
    </section>
  </main>

  <footer class="footer">
    <p class="couple-small" data-bind="couple"></p>
    <p><a href="/">Retour au site du mariage</a></p>
  </footer>
  <noscript><p class="noscript">Cette page a besoin de JavaScript.</p></noscript>
</body>
</html>
