# Site de mariage — docker compose up -d (ou « Compose Up » dans Compose Manager sur Unraid)
# Toutes les valeurs se règlent dans le fichier .env (voir .env.example).
# « pull_policy: build » : les images sont reconstruites à chaque démarrage à partir des fichiers
# du dossier (rapide grâce au cache), donc une mise à jour = déposer les fichiers + Compose Up.
name: monmariage

services:
  api:
    build: ./api
    image: monmariage-api:latest
    pull_policy: build
    container_name: monmariage-api
    restart: unless-stopped
    environment:
      # Propriétaire des fichiers de la base (Unraid : PUID=99 / PGID=100), réglé automatiquement au démarrage
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      INVITE_CODE: ${INVITE_CODE:-}
      TZ: ${TZ:-Europe/Paris}
      PRENOM_MARIE: ${PRENOM_MARIE:-}
      PRENOM_MARIEE: ${PRENOM_MARIEE:-}
    volumes:
      - ${DATA_PATH:-./data}:/data
    networks:
      - monmariage
    # Pas de port publié : l'API n'est joignable qu'à travers le conteneur web

  web:
    build: ./web
    image: monmariage-web:latest
    pull_policy: build
    container_name: monmariage-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Prénoms affichés dans les jeux (les images n'en contiennent aucun)
      PRENOM_MARIE: ${PRENOM_MARIE:-Hugo}
      PRENOM_MARIEE: ${PRENOM_MARIEE:-Léa}
    ports:
      - "${WEB_PORT:-8095}:80"
    networks:
      - monmariage

networks:
  monmariage:
    name: monmariage
